{% extends "base.html" %}{% block title %}Progresso{% endblock %}
{% block content %}<h1>Progresso das tarefas</h1><div class="card shadow-sm border-0 mt-3"><div class="card-body"><div class="grafico"><canvas id="grafico"></canvas></div></div></div>{% endblock %}
{% block scripts %}<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
<script>fetch('/api/progresso').then(r=>r.json()).then(d=>new Chart(document.getElementById('grafico'),{type:'doughnut',data:{labels:Object.keys(d),datasets:[{data:Object.values(d),backgroundColor:['#ffc107','#0d6efd','#198754']}]},options:{responsive:true,maintainAspectRatio:false}}));</script>{% endblock %}
