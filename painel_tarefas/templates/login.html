{% extends "base.html" %}{% block title %}Login{% endblock %}
{% block content %}<div class="auth-card card shadow border-0"><div class="card-body p-4">
<h2 class="mb-4"><i class="bi bi-box-arrow-in-right text-primary"></i> Entrar</h2>
<form method="post"><div class="mb-3"><label class="form-label">E-mail</label><input name="email" type="email" class="form-control" required></div>
<div class="mb-3"><label class="form-label">Senha</label><input name="senha" type="password" class="form-control" required></div>
<button class="btn btn-primary w-100">Entrar</button></form>
<p class="mt-3 mb-0 text-center">Não possui conta? <a href="{{ url_for('registro') }}">Cadastre-se</a></p>
</div></div>{% endblock %}
