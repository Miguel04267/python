{% extends "base.html" %}{% block title %}{{ 'Editar' if tarefa else 'Nova' }} tarefa{% endblock %}
{% block content %}<div class="card shadow-sm border-0"><div class="card-body p-4">
<h2>{{ 'Editar' if tarefa else 'Nova' }} tarefa</h2>
<form method="post"><div class="mb-3"><label class="form-label">Título</label><input name="titulo" class="form-control" maxlength="120" required value="{{ tarefa.titulo if tarefa else '' }}"></div>
<div class="mb-3"><label class="form-label">Descrição</label><textarea name="descricao" class="form-control" rows="4">{{ tarefa.descricao if tarefa else '' }}</textarea></div>
<div class="mb-3"><label class="form-label">Status</label><select name="status" class="form-select">
{% for s in ['Pendente','Em andamento','Concluída'] %}<option {{ 'selected' if tarefa and tarefa.status == s }}>{{ s }}</option>{% endfor %}
</select></div><button class="btn btn-primary"><i class="bi bi-save"></i> Salvar</button> <a class="btn btn-secondary" href="{{ url_for('dashboard') }}">Cancelar</a></form>
</div></div>{% endblock %}
